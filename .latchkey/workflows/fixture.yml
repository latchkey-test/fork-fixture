# AF1 fork fixture: .latchkey/workflows/fixture.yml on the DEFAULT branch
# (main) of the PUBLIC repository latchkey-test/fork-fixture (ruling 194).
# One cheap platform job on small. A pull request from a fork must be HELD by
# the trigger door and never reach this job in AF1; a push to main runs it,
# which is the fixture's own proof that the file compiles.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  hello:
    runs-on: small
    timeout-minutes: 5
    steps:
      - name: say where it ran
        run: echo "af1-fork-fixture repository=$LATCHKEY_CI_REPOSITORY sha=$LATCHKEY_CI_SHA fork=$LATCHKEY_CI_FORK run=$LATCHKEY_CI_RUN_ID"


